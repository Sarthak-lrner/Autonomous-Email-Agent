services:
  mysql:
    image: 'mysql:latest'
    container_name: 'support-agent-mysql'

    environment:
      - 'MYSQL_DATABASE=${MYSQL_DATABASE}'
      - 'MYSQL_USER=${DB_USER}'
      - 'MYSQL_PASSWORD=${DB_PASSWORD}'
      - 'MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}'

    ports:
      - '3306:3306'

    volumes:
      # Named volume -> data survives container restarts / recreation.
      - 'mysql-data:/var/lib/mysql'

      # Runs automatically on first initialization of a fresh volume.
      - './db/init:/docker-entrypoint-initdb.d:ro'

    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data: